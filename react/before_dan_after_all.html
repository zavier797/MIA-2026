<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebelum &amp; Sesudah – TransparansiWarga</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'sans-serif'], jakarta: ['Plus Jakarta Sans', 'sans-serif'] },
    colors: { warm: { 50:'#faf8f5',100:'#f3efe6',200:'#e5dccb',300:'#d4c2a7',400:'#bf9e7f',500:'#a7805b',600:'#8c6547',700:'#704f3a',800:'#3a2d24',900:'#231d19',950:'#161210' } }
  } }
}
</script>
<style>
@keyframes modalFadeIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.animate-modal{animation:modalFadeIn .3s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.animate-bg{animation:fadeBg .25s ease forwards}
html[data-theme="dark"] body{background:#171411!important;color:#f5eee2!important}
html[data-theme="dark"] #root [class*="bg-white"],
html[data-theme="dark"] #root [class*="bg-warm-50"],
html[data-theme="dark"] #root [class*="bg-warm-100"],
html[data-theme="dark"] #root [class*="bg-[#fffdf9]"],
html[data-theme="dark"] #root [class*="bg-[#faf8f4]"]{background-color:#24201b!important}
html[data-theme="dark"] #root [class*="text-warm-900"],
html[data-theme="dark"] #root [class*="text-warm-800"],
html[data-theme="dark"] #root [class*="text-[#2f1d10]"]{color:#f5eee2!important}
html[data-theme="dark"] #root [class*="text-warm-700"],
html[data-theme="dark"] #root [class*="text-warm-600"],
html[data-theme="dark"] #root [class*="text-warm-500"],
html[data-theme="dark"] #root [class*="text-[#7c6b5c]"],
html[data-theme="dark"] #root [class*="text-[#8a7a6c]"],
html[data-theme="dark"] #root [class*="text-[#9a8c7e]"]{color:#c6b8a5!important}
html[data-theme="dark"] #root [class*="border-warm-200"],
html[data-theme="dark"] #root [class*="border-[#f0e9df]"]{border-color:#494034!important}
</style>
</head>
<body class="bg-[#faf8f4] font-sans text-[#2f1d10] antialiased">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const HOME_URL = 'index.html';

/* ====== Data (sementara, 9 item). Ganti dengan data dari backend ====== */
const ph = (c, t) => `https://placehold.co/600x600/${c}/e5dccb?text=${t}`;
const IMG = [ph('5a4636', 'Sebelum'), ph('4a6b4f', 'Sesudah')];
const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pd = s => { const [a, b, c] = s.split('-'); return new Date(+a, +b - 1, +c); };
const fm = (d, l) => d.getDate() + ' ' + (l ? BLN[d.getMonth()] : BLN[d.getMonth()].slice(0, 3)) + ' ' + d.getFullYear();

const ITEMS = [
  ['0892','Jakarta Selatan','Perbaikan Jalan Berlubang Parah di Jl. Fatmawati','Jalan berlubang yang membahayakan pengendara telah ditambal dan diaspal ulang.','Dinas Bina Marga',2,'Infrastruktur Jalan','Terdapat lubang jalan cukup dalam dan lebar di lajur kiri dekat lampu merah yang sangat membahayakan pengendara motor saat malam hari.','Jl. Fatmawati No. 12, Kel. Cilandak Barat, Kec. Cilandak, Jakarta Selatan','Ahmad Warga','Rp 4.500.000','Pembersihan area lubang, pelapisan fondasi tack coat, dan penambalan dengan aspal hotmix 5cm dilanjutkan penggilasan drum roller.','-6.2915, 106.7972','2026-03-12',
    ['https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=600&q=80','https://images.unsplash.com/photo-1584467735815-f778f274e296?auto=format&fit=crop&w=600&q=80']],
  ['0731','Bandung','Pembersihan Tumpukan Sampah Bantaran Sungai','Penumpukan sampah yang menyumbat aliran sungai berhasil dibersihkan dan lokasi kini tertata rapi.','Dinas Lingkungan Hidup',1,'Kebersihan & Lingkungan','Sampah menumpuk di bantaran sungai hingga menutup aliran air dan menimbulkan bau menyengat bagi warga sekitar.','Bantaran Sungai Cikapundung, Kel. Braga, Kec. Sumur Bandung, Kota Bandung','Siti Rahma','Rp 2.800.000','Pengangkatan sampah dengan alat berat ringan, pembersihan sedimen, dan pemasangan jaring penahan sampah.','-6.9147, 107.6098','2026-03-20'],
  ['0954','Surabaya','Perbaikan Lampu Penerangan Jalan (PJU)','Penggantian bohlam PJU yang mati di area permukiman untuk mencegah potensi kejahatan malam.','Dinas Perhubungan',3,'Penerangan Jalan','Lampu jalan di gang permukiman mati berminggu-minggu sehingga area menjadi gelap dan rawan tindak kejahatan.','Jl. Darmo Permai Selatan, Kel. Putat Gede, Kec. Sukomanunggal, Surabaya','Budi Santoso','Rp 3.200.000','Penggantian 6 titik bohlam dan fotosel PJU, pengecekan kabel, serta uji nyala pada malam hari.','-7.2899, 112.7138','2026-04-02'],
  ['1020','Yogyakarta','Penataan Ulang Trotoar Rusak di Jl. Malioboro','Trotoar retak dan bergelombang dibongkar lalu dipasang ulang agar aman bagi pejalan kaki.','Dinas PUPR',4,'Fasilitas Pejalan Kaki','Trotoar retak dan bergelombang menyulitkan pejalan kaki, terutama lansia dan pengguna kursi roda.','Jl. Malioboro, Kel. Sosromenduran, Kec. Gedong Tengen, Yogyakarta','Dewi Lestari','Rp 7.600.000','Pembongkaran paving lama, pemadatan dasar, dan pemasangan paving baru dengan jalur pemandu difabel.','-7.7926, 110.3657','2026-04-10'],
  ['1087','Medan','Pengerukan Drainase Tersumbat di Jl. Gatot Subroto','Saluran air yang tersumbat lumpur dikeruk sehingga genangan saat hujan tidak lagi terjadi.','Dinas Sumber Daya Air',2,'Drainase & Banjir','Drainase penuh lumpur dan sampah sehingga jalan tergenang setiap kali hujan deras turun.','Jl. Gatot Subroto No. 45, Kel. Sei Sikambing, Kec. Medan Petisah, Medan','Rudi Hartono','Rp 5.100.000','Pengerukan endapan dengan ekskavator mini, pembersihan gorong-gorong, dan pengujian aliran air.','3.5897, 98.6584','2026-04-18'],
  ['1103','Semarang','Pemangkasan Pohon Rawan Tumbang di Jl. Pandanaran','Pohon yang condong ke badan jalan dipangkas untuk menghindari risiko tumbang saat cuaca buruk.','Dinas Pertamanan',1,'Ruang Terbuka Hijau','Pohon besar di tepi jalan miring dan cabangnya menjuntai ke badan jalan saat angin kencang.','Jl. Pandanaran No. 8, Kel. Mugassari, Kec. Semarang Selatan, Semarang','Maya Putri','Rp 1.900.000','Pemangkasan cabang rawan patah, penyangga batang utama, dan pembersihan sisa potongan di lokasi.','-6.9840, 110.4150','2026-04-25'],
  ['1156','Makassar','Pemasangan Kembali Rambu Lalu Lintas yang Roboh','Rambu yang roboh tertabrak kendaraan telah ditegakkan dan dicat ulang agar terlihat jelas.','Dinas Perhubungan',2,'Rambu & Marka','Rambu batas kecepatan roboh dan tergeletak di bahu jalan sehingga pengendara tidak melihatnya.','Jl. Urip Sumoharjo, Kel. Karampuang, Kec. Panakkukang, Makassar','Andi Pratama','Rp 2.300.000','Penegakan tiang rambu, pengecoran ulang pondasi, dan pengecatan reflektif agar terlihat jelas pada malam hari.','-5.1520, 119.4410','2026-05-03'],
  ['1189','Denpasar','Penataan Taman Kota yang Terbengkalai','Taman yang semula gersang dan penuh sampah kini ditanami ulang dan dilengkapi tempat duduk.','Dinas Lingkungan Hidup',5,'Taman Kota','Taman kota gersang, banyak sampah, dan bangku rusak sehingga tidak layak dipakai warga.','Jl. Raya Puputan, Kel. Renon, Kec. Denpasar Selatan, Denpasar','Komang Ayu','Rp 9.400.000','Pembersihan lahan, penanaman tanaman peneduh, pemasangan bangku dan tempat sampah, serta penataan jalur setapak.','-8.6705, 115.2358','2026-05-12'],
  ['1214','Palembang','Penutupan Lubang Galian Kabel di Jl. Sudirman','Bekas galian kabel yang dibiarkan terbuka telah ditutup dan dirapikan dengan aspal baru.','Dinas Bina Marga',3,'Infrastruktur Jalan','Bekas galian kabel dibiarkan terbuka dan berlubang sehingga membahayakan pengendara motor.','Jl. Jenderal Sudirman No. 21, Kel. 20 Ilir D.II, Kec. Ilir Timur I, Palembang','Yusuf Ramadhan','Rp 3.900.000','Pengurukan dan pemadatan galian, pemasangan aspal hotmix, serta rambu sementara selama pengerjaan.','-2.9761, 104.7754','2026-05-20']
].map(([no, kota, judul, ringkas, dinas, hari, kat, keluhan, alamat, pelapor, biaya, catatan, gps, mulai, img], i) =>
  ({ no, kota, judul, ringkas, dinas, hari, kat, keluhan, alamat, pelapor, biaya, catatan, gps, mulai, tiket: 'TW-2026-' + no, regu: 'BACDEFGHI'[i], img: img || IMG }));

/* ====== Pop up detail (isi sesuai kode yang diberikan) ====== */
const Foto = ({ src, lab, red, gps, by }) => (
  <div className="relative rounded-2xl overflow-hidden border border-warm-200 bg-warm-100 group">
    <div className="aspect-square w-full relative">
      <img src={src} alt={'Kondisi ' + lab} className={'w-full h-full object-cover group-hover:scale-105 transition duration-300 ' + (red ? 'grayscale-[30%]' : '')}
        onError={e => { e.currentTarget.onerror = null; e.currentTarget.src = ph('231d19', 'Foto+' + lab); }} />
      <div className="absolute top-3 left-3 border border-white/70 bg-warm-50/95 text-warm-800 text-xs font-bold px-3 py-1 rounded-lg uppercase tracking-wider shadow-sm">{lab}</div>
      <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-[#231d19]/85 via-[#231d19]/45 to-transparent p-3 text-[10px] text-white/90 space-y-0.5">
        <p className="font-mono flex items-center gap-1">
          <i className="fa-solid fa-location-crosshairs text-amber-300"></i><span>{gps}</span>
        </p>
        <p className="text-white/75">{by}</p>
      </div>
    </div>
  </div>
);

function Modal({ it, onClose }) {
  const s = pd(it.mulai), e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + it.hari);
  useEffect(() => {
    const k = x => x.key === 'Escape' && onClose();
    document.addEventListener('keydown', k);
    const o = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', k); document.body.style.overflow = o; };
  }, []);
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 font-jakarta text-warm-900 antialiased">
      <div className="absolute inset-0 bg-warm-900/45 backdrop-blur-sm animate-bg" onClick={onClose}></div>
      <div role="dialog" aria-modal="true" aria-label={'Detail pengaduan ' + it.tiket} className="relative z-10 w-full max-w-3xl bg-[#fffdf9] border border-warm-200 rounded-3xl shadow-2xl overflow-hidden animate-modal max-h-[92vh] flex flex-col">

        <div className="px-6 py-4 border-b border-warm-200 flex items-center justify-between bg-[#fffdf9]/95 sticky top-0 z-20">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 flex items-center justify-center font-bold text-xs"><i className="fa-solid fa-file-invoice"></i></div>
            <div>
              <h2 className="text-sm sm:text-base font-extrabold text-warm-900 tracking-tight">Detail Transparansi Pengaduan</h2>
              <span className="text-amber-800 font-mono text-[11px] font-bold">#{it.tiket}</span>
            </div>
          </div>
          <button autoFocus onClick={onClose} className="w-8 h-8 rounded-full bg-warm-100 hover:bg-warm-200 text-warm-600 hover:text-warm-900 flex items-center justify-center text-sm transition" title="Tutup" aria-label="Tutup">
            <i className="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div className="p-6 overflow-y-auto space-y-6 flex-1">
          <div className="bg-warm-50 border border-warm-200 rounded-2xl p-4 sm:p-5">
            <div className="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-warm-200">
              <div className="flex items-center gap-2">
                <span className="bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full">{it.kat}</span>
                <span className="text-warm-600 text-xs font-medium">{it.dinas}</span>
              </div>
              <span className="inline-flex items-center gap-1.5 bg-white border border-warm-200 text-warm-700 text-xs font-semibold px-3 py-1 rounded-full">
                <i className="fa-solid fa-circle-check text-xs text-amber-700"></i><span>Selesai</span>
              </span>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-3.5 text-xs">
              <div><span className="text-warm-500 text-[11px] block">Tanggal Diajukan</span><strong className="text-warm-900 font-semibold">{fm(s, true)}</strong></div>
              <div><span className="text-warm-500 text-[11px] block">Tanggal Selesai</span><strong className="text-warm-900 font-semibold">{fm(e, true)}</strong></div>
              <div className="col-span-2 sm:col-span-1">
                <span className="text-warm-500 text-[11px] block">Durasi SLA Penanganan</span>
                <strong className="text-amber-800 font-bold flex items-center gap-1"><i className="fa-regular fa-clock text-[11px]"></i><span>{it.hari} Hari ({it.hari * 24} Jam)</span></strong>
              </div>
            </div>
          </div>

          <div>
            <h3 className="text-xs font-bold uppercase tracking-wider text-warm-600 mb-2.5 flex items-center gap-2"><i className="fa-solid fa-images text-amber-700 text-xs"></i><span>Dokumentasi Komparasi Visual</span></h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <Foto src={it.img[0]} lab="Sebelum" red gps={it.gps} by={'Foto Pelapor \u2022 ' + fm(s) + ', 09:15 WIB'} />
              <Foto src={it.img[1]} lab="Sesudah" gps={it.gps} by={'Petugas Lapangan \u2022 ' + fm(e) + ', 14:30 WIB'} />
            </div>
          </div>

          <div className="bg-warm-50/80 border border-warm-200 rounded-2xl p-5 space-y-4">
            <h3 className="text-xs font-bold uppercase tracking-wider text-warm-600 flex items-center gap-2"><i className="fa-solid fa-circle-info text-amber-700 text-xs"></i><span>Informasi Keluhan Warga</span></h3>
            <div>
              <h4 className="text-base font-bold text-warm-900 mb-1.5">{it.judul}</h4>
              <p className="text-xs sm:text-sm text-warm-700 leading-relaxed bg-white p-3.5 rounded-xl border border-warm-200">“{it.keluhan}”</p>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 text-xs">
              <div className="flex items-start gap-2.5">
                <i className="fa-solid fa-location-dot text-amber-700 mt-0.5 shrink-0"></i>
                <div><span className="text-warm-500 text-[11px] block">Lokasi Kejadian</span><span className="text-warm-800 font-medium leading-tight block">{it.alamat}</span></div>
              </div>
              <div className="flex items-start gap-2.5">
                <i className="fa-solid fa-user text-amber-700 mt-0.5 shrink-0"></i>
                <div>
                  <span className="text-warm-500 text-[11px] block">Identitas Pelapor</span>
                  <span className="text-warm-800 font-medium">{it.pelapor}</span>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-warm-50/80 border border-warm-200 rounded-2xl p-5 space-y-4">
            <h3 className="text-xs font-bold uppercase tracking-wider text-amber-800 flex items-center gap-2"><i className="fa-solid fa-sack-dollar text-amber-700 text-xs"></i><span>Eksekusi Lapangan &amp; Transparansi Anggaran</span></h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div className="bg-white p-3.5 rounded-xl border border-warm-200">
                <span className="text-warm-500 text-[11px] block">Sumber Dana Anggaran</span>
                <strong className="text-warm-900 font-semibold">APBD DPA {it.dinas} 2026</strong>
                <span className="text-warm-500 text-[11px] block mt-0.5">(Dana Pemeliharaan Rutin)</span>
              </div>
              <div className="bg-white p-3.5 rounded-xl border border-warm-200">
                <span className="text-warm-500 text-[11px] block">Realisasi Pengeluaran Anggaran</span>
                <strong className="text-amber-800 text-base font-extrabold block">{it.biaya}</strong>
              </div>
            </div>
            <div className="space-y-1.5 text-xs">
              <span className="text-warm-600 font-semibold block">Catatan Penyelesaian Petugas Lapangan:</span>
              <p className="text-warm-700 leading-relaxed bg-white p-3.5 rounded-xl border border-warm-200">{it.catatan}</p>
            </div>
            <div className="flex items-center gap-2 pt-1 text-xs text-warm-700">
              <i className="fa-solid fa-people-group text-amber-700"></i>
              <span>Tim Pelaksana: <strong className="text-warm-900">Tim Reaksi Cepat Regu {it.regu} - {it.dinas}</strong></span>
            </div>
          </div>
        </div>

        <div className="px-6 py-3.5 border-t border-warm-200 bg-warm-50 flex items-center justify-between text-xs text-warm-600">
          <span className="flex items-center gap-1.5"><i className="fa-solid fa-shield-halved text-amber-700 text-xs"></i>Data Resmi Terverifikasi AksiWarga</span>
          <button onClick={onClose} className="bg-warm-800 hover:bg-warm-700 text-white font-semibold px-4 py-2 rounded-xl transition text-xs">Tutup</button>
        </div>
      </div>
    </div>
  );
}

/* ====== Kartu ====== */
const Card = ({ it, onOpen }) => (
  <article role="button" tabIndex={0} aria-label={'Lihat detail: ' + it.judul} onClick={() => onOpen(it)}
    onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(it); } }}
    className="cursor-pointer bg-white rounded-2xl overflow-hidden shadow-[0_4px_20px_rgba(80,50,20,.08)] hover:shadow-[0_14px_36px_rgba(80,50,20,.16)] hover:-translate-y-1 transition duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#c4833f]">
    <div className="grid grid-cols-2 gap-[2px] bg-white aspect-[1.87/1]">
      {[0, 1].map(i => (
        <div key={i} className="relative overflow-hidden">
          <img src={it.img[i]} alt={i ? 'Sesudah' : 'Sebelum'} loading="lazy" className="absolute inset-0 w-full h-full object-cover"
            onError={e => { e.currentTarget.onerror = null; e.currentTarget.src = IMG[i]; }} />
          <span className={'absolute top-2.5 left-2.5 text-[10px] font-bold tracking-wider px-2 py-1 rounded-md text-white ' + (i ? 'bg-[#5f8a64]/90' : 'bg-[#3b2f27]/85')}>{i ? 'SESUDAH' : 'SEBELUM'}</span>
        </div>
      ))}
    </div>
    <div className="p-[18px]">
      <div className="flex items-center gap-1.5 text-xs font-medium text-[#c4833f]"><i className="fa-solid fa-location-dot text-[11px]"></i>{it.kota}</div>
      <h3 className="mt-2 text-[15px] font-bold leading-snug text-[#2f1d10]">{it.judul}</h3>
      <p className="mt-2 text-[13px] leading-relaxed text-[#8a7a6c]">{it.ringkas}</p>
      <div className="mt-4 pt-3 border-t border-[#f0e9df] flex items-center justify-between gap-2">
        <span className="text-[11.5px] text-[#a89a8b] flex items-center gap-1.5"><i className="fa-regular fa-clock"></i>Selesai {it.hari} Hari</span>
        <span className="bg-[#f8e9d6] text-[#b0702c] text-[11.5px] font-semibold px-3 py-1 rounded-full">{it.dinas}</span>
      </div>
    </div>
  </article>
);

/* ====== Halaman ====== */
function App() {
  const [open, setOpen] = useState(null);
  const [theme, setTheme] = useState(() => localStorage.getItem('aksiwarga-theme') === 'dark' ? 'dark' : 'light');
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem('aksiwarga-theme', theme);
  }, [theme]);
  return (
    <section className="px-5 py-16 sm:py-24">
      <div className="mx-auto max-w-6xl">
        <header className="mb-8 flex items-center justify-between gap-3">
          <a href={HOME_URL} className="inline-flex items-center gap-2 text-xs text-[#9a8c7e] transition hover:text-[#2f1d10]"><i className="fa-solid fa-arrow-left text-[11px]"></i>Kembali ke Beranda</a>
          <button type="button" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} aria-label={theme === 'light' ? 'Aktifkan mode gelap' : 'Aktifkan mode terang'} aria-pressed={theme === 'dark'} className="inline-flex items-center gap-2 rounded-full border border-warm-200 bg-white px-3 py-2 text-xs font-semibold text-warm-700 transition hover:border-amber-600">
            <i className={'fa-solid ' + (theme === 'light' ? 'fa-moon' : 'fa-sun')} aria-hidden="true"></i>
            <span>{theme === 'light' ? 'Mode Gelap' : 'Mode Terang'}</span>
          </button>
        </header>
        <div className="text-center">
          <div className="flex items-center justify-center gap-3 text-[11px] font-medium uppercase tracking-[.2em] text-[#c4833f]">
            <span className="h-px w-10 bg-[#c4833f]/60"></span>Bukti Nyata Perubahan<span className="h-px w-10 bg-[#c4833f]/60"></span>
          </div>
          <h1 className="mt-4 text-[40px] font-bold leading-tight tracking-tight text-[#2f1d10]">Sebelum &amp; Sesudah</h1>
          <p className="mx-auto mt-5 max-w-xl text-[15px] leading-relaxed text-[#7c6b5c]">Dokumentasi visual perubahan nyata dari setiap pengaduan warga yang telah diselesaikan oleh instansi terkait.</p>
        </div>
        <div className="mt-10 grid items-start gap-6 md:grid-cols-2 lg:grid-cols-3">
          {ITEMS.map(it => <Card key={it.no} it={it} onOpen={setOpen} />)}
        </div>
      </div>
      {open && <Modal it={open} onClose={() => setOpen(null)} />}
    </section>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
